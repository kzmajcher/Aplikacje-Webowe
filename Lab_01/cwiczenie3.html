<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Ćwiczenie 3</title>
    <style>
      .wiersz {
        display: flex;
        gap: 15px;
        margin-bottom: 15px;
      }

      .kwadrat {
        width: 100px;
        height: 100px;
      }

      .kolor1 {
        background-color: rgb(248, 67, 67);
      }
      .kolor2 {
        background-color: rgb(66, 66, 190);
      }
      .kolor3 {
        background-color: rgb(41, 243, 41);
      }
      .kolor4 {
        background-color: rgb(255, 177, 31);
      }
    </style>
  </head>
  <body>
    <h2>Kolorowe kwadraty</h2>

    <div class="wiersz">
      <div class="kwadrat kolor1"></div>
      <div class="kwadrat kolor2"></div>
    </div>

    <div class="wiersz">
      <div class="kwadrat kolor3"></div>

      <!-- Obrazek zastępujący jeden z div-ów, ma klasę .kwadrat dla tych samych wymiarów -->
      <img
        src="https://i.redd.it/uz5gc2w5syg21.jpg"
        width="100"
        height="100"
        alt="Obrazek 100x100"
        class="kwadrat"
      />

      <div class="kwadrat kolor4"></div>
    </div>
  </body>
</html>
